quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/sgi_comando}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:sgi}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.max-size=64
quarkus.datasource.jdbc.acquisition-timeout=5S

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

quarkus.http.auth.basic=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,X-Interconnection-Id,X-Contract-Version
quarkus.http.enable-compression=true
quarkus.http.limits.max-body-size=30M
quarkus.http.limits.max-form-attribute-size=64K
quarkus.http.body.delete-uploaded-files-on-end=true

quarkus.smallrye-openapi.info-title=SGI Comando API
quarkus.smallrye-openapi.info-version=SER0.9.1-COM1.1.4-ASI0.7.4
quarkus.swagger-ui.always-include=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.category."org.hibernate.SQL".level=INFO

# El instanceCountryId se resuelve desde CORE y se conserva en instance_country_context.
# No se configura un UUID local para evitar una identidad paralela a CORE.
#sgi.instance-country-id=${SGI_INSTANCE_COUNTRY_ID:11111111-1111-1111-1111-111111111111}
sgi.minio.endpoint=${SGI_MINIO_ENDPOINT:http://localhost:9000}
sgi.minio.access-key=${SGI_MINIO_ACCESS_KEY:sgiadmin}
sgi.minio.secret-key=${SGI_MINIO_SECRET_KEY}

# Adaptador provisional CORE mientras IDENT no entrega el código ISO alpha-2 del país.
# En este ambiente se resuelve EC contra /catalog/countries y se utiliza el id devuelto.
sgi.core.catalog-base-url=${SGI_CORE_CATALOG_BASE_URL:http://192.168.20.138:5173}
sgi.core.country-code=${SGI_CORE_COUNTRY_CODE:EC}
sgi.core.instance-country-code=${SGI_CORE_INSTANCE_COUNTRY_CODE:ECU-CM}
sgi.core.catalog-timeout-ms=${SGI_CORE_CATALOG_TIMEOUT_MS:5000}
sgi.core.country-cache-seconds=${SGI_CORE_COUNTRY_CACHE_SECONDS:300}

# Disabled by default until the UAT identity-to-employee bindings are provisioned.
sgi.operator.relief-uat-enabled=${SGI_OPERATOR_RELIEF_UAT_ENABLED:false}

# SITC-NOM-001 v4.1 — Generic integration module (P0/P1 hardening)
# CORE resolver is the single bootstrap endpoint. All other target bindings are resolved from CORE.
sgi.interconnections.core-resolver-url=${SGI_INTERCONNECTIONS_CORE_RESOLVER_URL:http://192.168.20.138:5173}
sgi.interconnections.environment=${SGI_INTERCONNECTIONS_ENVIRONMENT:UAT}
# Id (UUID) de la Instancia PE en CORE para resolver bindings (temporal hasta que IDENT entregue el id de la empresa).
sgi.interconnections.instance-country-id=${SGI_INTERCONNECTIONS_INSTANCE_COUNTRY_ID:}
sgi.interconnections.core-timeout-ms=${SGI_INTERCONNECTIONS_CORE_TIMEOUT_MS:2500}
sgi.interconnections.cache-ttl-seconds=${SGI_INTERCONNECTIONS_CACHE_TTL_SECONDS:300}
sgi.interconnections.allow-stale-seconds=${SGI_INTERCONNECTIONS_ALLOW_STALE_SECONDS:3600}
sgi.interconnections.circuit-failure-threshold=${SGI_INTERCONNECTIONS_CIRCUIT_FAILURE_THRESHOLD:5}
sgi.interconnections.circuit-open-seconds=${SGI_INTERCONNECTIONS_CIRCUIT_OPEN_SECONDS:30}
sgi.core.country-id=${SGI_CORE_COUNTRY_ID:81000000-0000-0000-0000-000000000007}

# Inbound SIC:RRHH service identity. Only credential_ref is portable; the secret is resolved at runtime.
sgi.rrhh.inbound.credential-ref=${SGI_RRHH_INBOUND_CREDENTIAL_REF:}
# false: deriva employee_id desde personas.id. true: exige y utiliza canonicalEmployeeId.
sgi.integrations.rrhh.use-canonical-employee-id=${SGI_RRHH_USE_CANONICAL_EMPLOYEE_ID:false}
# Inbound SIC:COM service identity. This setting is only a credential_ref;
# CredentialRefResolver obtains the effective token at runtime and no token is stored here.
sgi.sic-com.inbound.credential-ref=${SGI_SIC_COM_INBOUND_CREDENTIAL_REF:}

# Almacenamiento de fotos (MinIO) y evidencias del agente
sgi.storage.standard-bucket=${SGI_STORAGE_STANDARD_BUCKET:sgi-standard}
sgi.storage.evidence-bucket=${SGI_STORAGE_EVIDENCE_BUCKET:sgi-evidence}
sgi.storage.migrate-standard-images=${SGI_STORAGE_MIGRATE_STANDARD_IMAGES:true}
sgi.evidence.max-file-bytes=5242880
sgi.evidence.max-files-per-request=5
sgi.evidence.default-radius-m=50

# VISINT: real (HTTP) por defecto. El simulado (MOCK) solo funciona con la bandera UAT activa.
sgi.visint.mode=${SGI_VISINT_MODE:HTTP}
sgi.visint.worker-enabled=true
sgi.visint.max-attempts=5
sgi.visint.mock.latency-ms=${SGI_VISINT_MOCK_LATENCY_MS:800}
# Interconexión que CORE resuelve a la URL de VISINT; si CORE falla se usa SGI_VISINT_URL.
sgi.visint.interconnection-code=${SGI_VISINT_INTERCONNECTION_CODE:SGI_COM_VISINT_0001_v002}
sgi.visint.url=${SGI_VISINT_URL:}
sgi.visint.token=${SGI_VISINT_TOKEN:}
sgi.visint.auth-header=${SGI_VISINT_AUTH_HEADER:X-API-Key}
sgi.visint.auth-scheme=${SGI_VISINT_AUTH_SCHEME:}
sgi.visint.timeout-seconds=${SGI_VISINT_TIMEOUT_SECONDS:60}
# Herramientas UAT (VISINT simulado, Simulador de Agente). Apagadas en producción.
sgi.uat.features-enabled=${SGI_UAT_FEATURES_ENABLED:false}

%test.sgi.operator.relief-uat-enabled=true
%test.sgi.storage.standard-bucket=sgi-standard-test
%test.sgi.storage.evidence-bucket=sgi-evidence-test
%test.sgi.storage.migrate-standard-images=false
%test.sgi.visint.mode=MOCK
%test.sgi.uat.features-enabled=true
%test.sgi.visint.worker-enabled=false
%test.sgi.visint.mock.latency-ms=0
