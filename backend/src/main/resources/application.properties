quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/sgi_comando}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:sgi}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.max-size=64
quarkus.datasource.jdbc.acquisition-timeout=5S

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

quarkus.http.auth.basic=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,X-Interconnection-Id,X-Contract-Version
quarkus.http.enable-compression=true
quarkus.http.limits.max-body-size=20M

quarkus.smallrye-openapi.info-title=SGI Comando API
quarkus.smallrye-openapi.info-version=SER0.9.1-COM1.1.4-ASI0.7.4
quarkus.swagger-ui.always-include=true

quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.category."org.hibernate.SQL".level=INFO

sgi.instance-country-id=11111111-1111-1111-1111-111111111111
sgi.minio.endpoint=${SGI_MINIO_ENDPOINT:http://localhost:9000}
sgi.minio.access-key=${SGI_MINIO_ACCESS_KEY:sgiadmin}
sgi.minio.secret-key=${SGI_MINIO_SECRET_KEY}

# Disabled by default until the UAT identity-to-employee bindings are provisioned.
sgi.operator.relief-uat-enabled=${SGI_OPERATOR_RELIEF_UAT_ENABLED:false}

# SITC-NOM-001 v4.1 — Generic integration module (P0/P1 hardening)
# CORE resolver is the single bootstrap endpoint. All other target bindings are resolved from CORE.
sgi.interconnections.core-resolver-url=${SGI_INTERCONNECTIONS_CORE_RESOLVER_URL:}
sgi.interconnections.environment=${SGI_INTERCONNECTIONS_ENVIRONMENT:UAT}
sgi.interconnections.core-timeout-ms=${SGI_INTERCONNECTIONS_CORE_TIMEOUT_MS:2500}
sgi.interconnections.cache-ttl-seconds=${SGI_INTERCONNECTIONS_CACHE_TTL_SECONDS:300}
sgi.interconnections.allow-stale-seconds=${SGI_INTERCONNECTIONS_ALLOW_STALE_SECONDS:3600}
sgi.interconnections.circuit-failure-threshold=${SGI_INTERCONNECTIONS_CIRCUIT_FAILURE_THRESHOLD:5}
sgi.interconnections.circuit-open-seconds=${SGI_INTERCONNECTIONS_CIRCUIT_OPEN_SECONDS:30}

# Inbound SIC:RRHH service identity. Only credential_ref is portable; the secret is resolved at runtime.
sgi.rrhh.inbound.credential-ref=${SGI_RRHH_INBOUND_CREDENTIAL_REF:}
# false: deriva employee_id desde personas.id. true: exige y utiliza canonicalEmployeeId.
sgi.integrations.rrhh.use-canonical-employee-id=${SGI_RRHH_USE_CANONICAL_EMPLOYEE_ID:false}
# Inbound SIC:COM service identity. This setting is only a credential_ref;
# CredentialRefResolver obtains the effective token at runtime and no token is stored here.
sgi.sic-com.inbound.credential-ref=${SGI_SIC_COM_INBOUND_CREDENTIAL_REF:}
