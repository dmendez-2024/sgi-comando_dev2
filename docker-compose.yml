services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgi_comando}
      POSTGRES_USER: ${POSTGRES_USER:-sgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "56432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgi} -d ${POSTGRES_DB:-sgi_comando}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    #image: minio/minio:latest
    #image: quay.io/minio/aistor/minio:RELEASE.2026-03-26T21-24-40Z
    #command: server /data --console-address ":9001"
    #environment:
      #MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgiadmin}
      #MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    # MinIO comunitario (Bitnami). La imagen AIStor (quay.io/minio/aistor) requiere licencia comercial
    # y las imágenes comunitarias minio/minio ya no se publican.
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      #- minio_data:/data
      - minio_data:/bitnami/minio/data
  backend:
    build:
      context: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sgi_comando}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-sgi}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SGI_MINIO_ENDPOINT: http://minio:9000
      SGI_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sgiadmin}
      SGI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      SGI_CORE_CATALOG_BASE_URL: ${SGI_CORE_CATALOG_BASE_URL:-http://192.168.20.138:5173/api/v1}
      SGI_CORE_COUNTRY_CODE: ${SGI_CORE_COUNTRY_CODE:-EC}
      SGI_CORE_INSTANCE_COUNTRY_CODE: ${SGI_CORE_INSTANCE_COUNTRY_CODE:-}
      SGI_CORE_CATALOG_TIMEOUT_MS: ${SGI_CORE_CATALOG_TIMEOUT_MS:-5000}
      SGI_CORE_COUNTRY_CACHE_SECONDS: ${SGI_CORE_COUNTRY_CACHE_SECONDS:-300}
      SGI_INTERCONNECTIONS_CORE_RESOLVER_URL: ${SGI_INTERCONNECTIONS_CORE_RESOLVER_URL:-}
      SGI_INTERCONNECTIONS_ENVIRONMENT: ${SGI_INTERCONNECTIONS_ENVIRONMENT:-UAT}
      SGI_INTERCONNECTIONS_CORE_TIMEOUT_MS: ${SGI_INTERCONNECTIONS_CORE_TIMEOUT_MS:-2500}
      SGI_INTERCONNECTIONS_CACHE_TTL_SECONDS: ${SGI_INTERCONNECTIONS_CACHE_TTL_SECONDS:-300}
      SGI_INTERCONNECTIONS_ALLOW_STALE_SECONDS: ${SGI_INTERCONNECTIONS_ALLOW_STALE_SECONDS:-3600}
      SGI_INTERCONNECTIONS_CIRCUIT_FAILURE_THRESHOLD: ${SGI_INTERCONNECTIONS_CIRCUIT_FAILURE_THRESHOLD:-5}
      SGI_INTERCONNECTIONS_CIRCUIT_OPEN_SECONDS: ${SGI_INTERCONNECTIONS_CIRCUIT_OPEN_SECONDS:-30}
      SGI_RRHH_INBOUND_CREDENTIAL_REF: ${SGI_RRHH_INBOUND_CREDENTIAL_REF:-}
      SGI_RRHH_USE_CANONICAL_EMPLOYEE_ID: ${SGI_RRHH_USE_CANONICAL_EMPLOYEE_ID:-false}
      SGI_SIC_COM_INBOUND_CREDENTIAL_REF: ${SGI_SIC_COM_INBOUND_CREDENTIAL_REF:-}
      SGI_CREDENTIAL_SIC_COM_SGI_COM_0001_V001: ${SGI_CREDENTIAL_SIC_COM_SGI_COM_0001_V001:-}
      SGI_CREDENTIAL_SIC_RRHH_SGI_COM_0001_V001: ${SGI_CREDENTIAL_SIC_RRHH_SGI_COM_0001_V001:-}
      SGI_OPERATOR_RELIEF_UAT_ENABLED: ${SGI_OPERATOR_RELIEF_UAT_ENABLED:-false}
      # VISINT real (HTTP) por defecto; MOCK solo con SGI_UAT_FEATURES_ENABLED=true.
      SGI_VISINT_MODE: ${SGI_VISINT_MODE:-HTTP}
      SGI_VISINT_URL: ${SGI_VISINT_URL:-}
      SGI_VISINT_TOKEN: ${SGI_VISINT_TOKEN:-}
      SGI_UAT_FEATURES_ENABLED: ${SGI_UAT_FEATURES_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: repo_postgres_data
  minio_data:
    name: repo_minio_data
