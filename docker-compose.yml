services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgi_comando}
      POSTGRES_USER: ${POSTGRES_USER:-sgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgi_uat_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgi} -d ${POSTGRES_DB:-sgi_comando}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sgi_minio_uat_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sgi_comando}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-sgi}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sgi_uat_2026}
      SGI_MINIO_ENDPOINT: http://minio:9000
      SGI_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sgiadmin}
      SGI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sgi_minio_uat_2026}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
